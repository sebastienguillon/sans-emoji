<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sans Emoji — local editor test fixture</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f6f5ef;
        --ink: #20231d;
        --muted: #5c6353;
        --line: #d5d8ca;
        --green: #526600;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font: 24px / 1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 0 64px;
        padding: 36px 0;
        border-bottom: 1px solid var(--line);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 30px;
        font-weight: 750;
        letter-spacing: -0.03em;
      }
      .brand img { width: 52px; height: 52px; }
      .fixture-label { color: var(--muted); font-size: 20px; }
      main { padding: 42px 64px 0; }
      h1 {
        margin: 0 0 16px;
        font-size: 60px;
        font-weight: 700;
        line-height: 1.12;
        letter-spacing: -0.04em;
      }
      .description { margin: 0; color: var(--muted); font-size: 26px; }
      .editor-frame {
        margin-top: 40px;
        height: 296px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
      }
      .toolbar {
        height: 76px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 28px;
        border-bottom: 1px solid var(--line);
        color: var(--muted);
        font-size: 20px;
      }
      #picker {
        padding: 9px 18px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        color: var(--ink);
        font: 600 19px / 1.5 system-ui, sans-serif;
      }
      #picker:hover { background: #e8eddb; }
      #picker:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
      #editor {
        white-space: pre-wrap;
        min-height: 218px;
        padding: 34px 38px;
        border: 0;
        outline: 0;
        font-size: 34px;
        caret-color: var(--green);
      }
      #editor:focus { box-shadow: inset 0 -2px var(--green); }
      ::selection { background: #d5ed75; }
      .ak-emoji-picker {
        position: absolute;
        top: 416px;
        right: 93px;
        display: grid;
        place-items: center;
        width: 128px;
        height: 120px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--paper);
        font-size: 64px;
        line-height: 1;
      }
      footer {
        position: absolute;
        top: 704px;
        left: 64px;
        right: 64px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand"><img src="/icon.svg" alt="" />Sans Emoji</div>
      <span class="fixture-label" id="fixture-label">Local editor test fixture</span>
    </header>
    <main>
      <h1 id="headline">Keep writing after a colon.</h1>
      <p class="description" id="description">Dismiss colon-triggered emoji suggestions. Keep your text.</p>
      <section class="editor-frame" aria-label="Local demonstration editor">
        <div class="toolbar"><span id="sample-label">Sample text</span><div id="picker-slot"></div></div>
        <div id="editor-slot"></div>
      </section>
    </main>
    <footer id="disclosure">Demonstration of the shared Chrome &amp; Firefox build. This is not an Atlassian product screen.</footer>
  </body>
</html>
